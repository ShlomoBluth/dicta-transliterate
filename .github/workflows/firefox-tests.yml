name: Firefox tests

on:
  schedule:
    - cron: '0 2,10,18 * * *'
  workflow_dispatch: # manual run from the Actions tab; choose which specs to run
    inputs:
      tool-tests:
        description: Run toolTests
        type: boolean
        default: false
      requests-tests:
        description: Run requestsTests
        type: boolean
        default: true

concurrency:
  group: firefox-tests
  cancel-in-progress: false

permissions:
  contents: write # the called workflow deploys the report to gh-pages

jobs:
  cypress:
    uses: ShlomoBluth/workflows/.github/workflows/cypress-tests.yml@v2
    with:
      browser: firefox
      # scheduled/push runs use the fixed value; manual runs use the checkbox
      tool-tests: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.tool-tests) || 'false' }}
      requests-tests: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.requests-tests) || 'true' }}
    secrets: inherit
